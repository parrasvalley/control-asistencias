      if(!raw) return;
      const v = JSON.parse(raw);
      if(validar(v)) resultado = v;
    } catch(e){}
  });
  return resultado;
}

// Cargar estado inicial - primero master, luego claves antiguas
function cargarEstadoInicial() {
  const master = loadMaster();
  // Si hay plantilla guardada en localStorage, usarla - NO pisar con el codigo
  if(master && master.plt && Object.keys(master.plt).length > 0) {
    return { areas: master.areas||AREAS_DEFAULT, plt: master.plt, dat: master.dat||[], hist: master.hist||[] };
  }
  // Solo si no hay nada guardado, usar la plantilla del codigo
  const pltBase = {};
  Object.entries(PLANTILLA_FIJA).forEach(([areaId, personas]) => {
    pltBase[areaId] = personas;
  });
  return { areas: AREAS_DEFAULT, plt: pltBase, dat: [], hist: [] };
}

// Sueldos fijos semanales - costo diario = sueldo / 7, sin extras
const SUELDOS_FIJOS = {
  "Xochil Viridiana Limetta Cuero":       4500,
  "Jose Eduardo Tobias":                  4100,
  "Bernabe Flores Salazar":               4500,
  "Cristo Fernando Matamoros Rodriguez":  4000,
  "Elsa Guadalupe Reyes Amaya":           4250,
  "Alberto Guadalupe Cruz Hernandez":     4000,
  "Cesar Ramon Lopez":                    4500,
  "Luis Bernal":                          4500,
  "Gabriela Hernandez Abreu":             4000,
};

const getSueldoFijo = nombre => SUELDOS_FIJOS[nombre] || null;
const getCostoDiarioFijo = nombre => { const s=getSueldoFijo(nombre); return s?s/7:null; };

const getOpsBase = b => b==="embolsado"?OPS_EMBOLSADO:b==="carton"?OPS_CARTON:b==="indirectos"?OPS_INDIRECTOS:b==="euro_extra"?OPS_EURO_EXTRA:OPS_GENERAL;
const getOps     = a => [...getOpsBase(a.opsBase||"general"), ...(a.opsExtra||[])];
const money  = v => "$"+Number(v).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt1   = v => Number(v).toLocaleString("es-MX",{minimumFractionDigits:1,maximumFractionDigits:1});
const toMins = str => { if(!str) return null; const [h,m]=str.split(":").map(Number); return h*60+(m||0); };
const diffMins = (a,b) => { const ma=toMins(a),mb=toMins(b); if(ma===null||mb===null) return 0; return mb<=ma?mb+1440-ma:mb-ma; };

function calcDist(tw, areas) {
  // Descanso con goce: paga jornal completo sin segmentos
  if(tw.estado==="descanso_c"){
    const costoFijo=getCostoDiarioFijo(tw.nombre);
    const total=costoFijo!==null?costoFijo:SUELDO_DIA;
    return {distLineas:{[tw.lineaBase]:{frac:1,costo:total,mins:480}},costoTotal:total,horas:8,extras:0,esFijo:costoFijo!==null};
  }
  // Falta o descanso sin goce: sin costo
  if(tw.estado==="falta"||tw.estado==="descanso_s"){
    return {distLineas:{},costoTotal:0,horas:0,extras:0,esFijo:false};
  }

  const segs = tw.segmentos||[];
  if(!segs.length) return {distLineas:{},costoTotal:0,horas:0,extras:0};

  // Si tiene sueldo fijo: costo diario fijo, sin extras
  const costoFijo = getCostoDiarioFijo(tw.nombre);

  const mpl={};
  let totalMins=0;
  segs.forEach(s=>{
    if(!s.inicio||!s.fin) return;
    const m=diffMins(s.inicio,s.fin);
    if(m<=0) return;
    mpl[s.areaId]=(mpl[s.areaId]||0)+m;
    totalMins+=m;
  });
  if(totalMins<=0) return {distLineas:{},costoTotal:0,horas:0,extras:0};

  const aBase=areas.find(a=>a.id===tw.lineaBase);
  const minsBase=mpl[tw.lineaBase]||0;
  const horasBase=minsBase/60;
  const horasOtras=Object.entries(mpl).filter(([lid])=>lid!==tw.lineaBase).reduce((s,[,m])=>s+m/60,0);
  let horasEf=horasBase+horasOtras;
  // Descuento de comida y cena sobre el total efectivo
  if(aBase?.hayComida) horasEf=Math.max(0,horasEf-1);
  if(aBase?.hayCena)   horasEf=Math.max(0,horasEf-1);
  // Horas base corregidas para distribucion proporcional
  const horasBaseCorr=Math.max(0,horasBase-(aBase?.hayComida?1:0)-(aBase?.hayCena?1:0));

  let total, extras;
  if(costoFijo!==null){
    // Sueldo fijo: no genera extras
    total = costoFijo;
    extras = 0;
  } else {
    extras=Math.max(0,horasEf-HORAS_JORNAL);
    const base=Math.min(horasEf,HORAS_JORNAL)/HORAS_JORNAL*SUELDO_DIA;
    total=base+extras*COSTO_HREXT;
  }

  const minsCor={...mpl,[tw.lineaBase]:horasBaseCorr*60};
  const totalCor=Object.values(minsCor).reduce((s,m)=>s+m,0);
  const dl={};
  Object.entries(minsCor).forEach(([lid,m])=>{
    const frac=totalCor>0?m/totalCor:0;
    dl[lid]={frac,costo:frac*total,mins:mpl[lid]||0};
  });
  return {distLineas:dl,costoTotal:total,horas:horasEf,extras,esFijo:costoFijo!==null};
}

  // Cargar estado inicial UNA sola vez
  const [estado] = useState(cargarEstadoInicial);
  const [areas, setAreas] = useState(()=>{
    const est = cargarEstadoInicial();
    // Asegurar que Indirectos siempre tenga opsBase correcto
    const areasBase = est.areas || AREAS_DEFAULT;
    const tieneIndirectos = areasBase.some(a=>a.id==="indirectos");
    if(!tieneIndirectos) {
      return [...areasBase, { id:"indirectos", nombre:"Indirectos", color:COLORES[6], bg:COLORES_BG[6], hayComida:true, hayCena:false, opsBase:"indirectos", opsExtra:[] }];
    }
    return areasBase.map(a=>a.id==="indirectos"?{...a,opsBase:"indirectos"}:a);
  });
  const [plantilla, setPlantilla] = useState(()=>{
    const guardada = estado.plt || {};
    const fusionada = {...guardada};
    Object.entries(PLANTILLA_FIJA).forEach(([areaId, personas]) => {
      const existentes = [...(fusionada[areaId] || [])];
      const nuevas = [];
      personas.forEach(p => {
        const idx = existentes.findIndex(x => (x.nombre||x) === p.nombre);
        if(idx === -1) {
          nuevas.push(p);
        } else if(!existentes[idx].operacion && p.operacion) {
          existentes[idx] = {...existentes[idx], operacion: p.operacion};
        }
      });
      fusionada[areaId] = [...existentes, ...nuevas];
    });
    // Guardar inmediatamente en localStorage
    try {
      const master = JSON.parse(localStorage.getItem(MASTER_KEY)||'{}');
      master.plt = fusionada;
      localStorage.setItem(MASTER_KEY, JSON.stringify(master));
    } catch(e) {}
    return fusionada;
  });
  const [asistencias, setAsist]      = useState(()=>estado.dat||[]);
  const [historial,   setHist]       = useState(()=>estado.hist||[]);
  const [extras,      setExtras]     = useState(()=>lsLoad("ca-extras-v1",{})); // {areaId: {cenas:0, bultos:0}}
  const PRECIO_CENA = 55;
  const saveExtras = v => { setExtras(v); lsSave("ca-extras-v1",v); };
  const [tab,         setTab]        = useState("areas");
  const [inputs,      setInputs]     = useState({});
  const [opInputs,    setOpInputs]   = useState({});
  const [openArea,    setOpenArea]   = useState(null);
  const [openPlt,     setOpenPlt]    = useState(null);
  const [nuevoArea,   setNuevoArea]  = useState("");
  const [opExtraInp,  setOpExtraInp] = useState({});
  const [selGrupo,    setSelGrupo]   = useState([]);
  const [movLineaId,  setMovLineaId] = useState(null);
  const [movSegs,     setMovSegs]    = useState([]);
  const [vistaRep,    setVistaRep]   = useState(null);
  const [arranqueHoras, setArranqueHoras] = useState({});
  const [busqueda,      setBusqueda]      = useState("");
  const [fechaDia,      setFechaDia]      = useState(()=>lsLoad("ca-fecha-v1", new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"})));
  const saveFecha = v => { setFechaDia(v); lsSave("ca-fecha-v1",v); };
  const [confirmDelArea,  setConfirmDelArea]  = useState(null);
  const [confirmNuevoDia, setConfirmNuevoDia] = useState(false);
  const [confirmDelHist,  setConfirmDelHist]  = useState(false);

  // Guardar TODO en master - siempre con valores mas recientes
  const guardarTodo = (a,p,d,h) => saveMaster({areas:a,plt:p,dat:d,hist:h});

  const saveAreas = v => { setAreas(v);  lsSave(MASTER_KEY, {...loadMaster()||{}, areas:v}); };
  const savePlt   = v => { setPlantilla(v); lsSave(MASTER_KEY, {...loadMaster()||{}, plt:v}); };
  const saveAsist = v => { setAsist(v);  lsSave(MASTER_KEY, {...loadMaster()||{}, dat:v}); };
  const saveHist  = v => { setHist(v);   lsSave(MASTER_KEY, {...loadMaster()||{}, hist:v}); };

  // Guardar areas corregidas al arrancar (fuerza Indirectos con opsBase correcto)
  useEffect(()=>{ guardarTodo(areas,plantilla,asistencias,historial); },[]);

  // Sincronizar plantilla con areas
  useEffect(()=>{
    const np={...plantilla}; let c=false;
    areas.forEach(a=>{if(!np[a.id]){np[a.id]=[];c=true;}});
    if(c) savePlt(np);
  },[areas]);

  // Areas
  const updArea=(id,k,v)=>saveAreas(areas.map(a=>a.id===id?{...a,[k]:v}:a));
  const addOpExtra=(id,op)=>{if(!op.trim()) return; const a=areas.find(x=>x.id===id); if(!a||a.opsExtra.includes(op.trim())) return; updArea(id,"opsExtra",[...a.opsExtra,op.trim()]); setOpExtraInp(x=>({...x,[id]:""}));};
  const delOpExtra=(id,op)=>{const a=areas.find(x=>x.id===id); if(a) updArea(id,"opsExtra",a.opsExtra.filter(o=>o!==op));};
  const confirmarDelArea=()=>{saveAreas(areas.filter(a=>a.id!==confirmDelArea));setConfirmDelArea(null);setOpenArea(null);};
  const addArea=()=>{
    if(!nuevoArea.trim()) return;
    const idx=areas.length%COLORES.length, id="area_"+Date.now();
    saveAreas([...areas,{id,nombre:nuevoArea.trim(),color:COLORES[idx],bg:COLORES_BG[idx],hayComida:true,hayCena:false,opsBase:"general",opsExtra:[]}]);
    setNuevoArea("");
  };

  // Plantilla
  const addNombre=lid=>{
    const nm=(inputs[lid]||"").trim();
    if(!nm||(plantilla[lid]||[]).some(p=>(p.nombre||p)===nm)) return;
    savePlt({...plantilla,[lid]:[...(plantilla[lid]||[]),{nombre:nm,operacion:opInputs[lid]||""}]});
    setInputs(i=>({...i,[lid]:""})); setOpInputs(i=>({...i,[lid]:""}));
  };
  const delNombre=(lid,nm)=>savePlt({...plantilla,[lid]:(plantilla[lid]||[]).filter(p=>(p.nombre||p)!==nm)});
  const updOpPlt=(lid,nm,op)=>savePlt({...plantilla,[lid]:(plantilla[lid]||[]).map(p=>(p.nombre||p)===nm?{nombre:nm,operacion:op}:p)});

  const iniciarDia=()=>{
    const nuevas=[];
    areas.forEach(a=>{(plantilla[a.id]||[]).forEach(p=>{
      nuevas.push({id:Date.now()+Math.random(),nombre:p.nombre||p,lineaBase:a.id,ausente:false,operacion:p.operacion||"",segmentos:[{areaId:a.id,inicio:"",fin:""}]});
    });});
    saveAsist(nuevas); setTab("asistencia");
  };

  const iniciarLinea=(areaId, horaInicio)=>{
    const enPlt = plantilla[areaId]||[];
    if(!enPlt.length) return;
    const nombresFijos = new Set(Object.keys(SUELDOS_FIJOS));
    const yaExisten = new Set(asistencias.map(tw=>tw.nombre));
    const nuevas=[...asistencias];
    enPlt.forEach(p=>{
      const nm=p.nombre||p;
      // Saltar solo los de sueldo fijo explicito
      if(nombresFijos.has(nm)) return;
      if(yaExisten.has(nm)){
        const idx=nuevas.findIndex(tw=>tw.nombre===nm);
        if(idx>=0){
          nuevas[idx]={...nuevas[idx], arrancado:true};
          if(horaInicio){
            const segs=[...(nuevas[idx].segmentos||[])];
            if(segs.length>0 && !segs[0].inicio) segs[0]={...segs[0],inicio:horaInicio};
            else if(segs.length===0) segs.push({areaId,inicio:horaInicio,fin:""});
            nuevas[idx]={...nuevas[idx],segmentos:segs};
          }
        }
      } else {
        nuevas.push({id:Date.now()+Math.random(),nombre:nm,lineaBase:areaId,ausente:false,
          arrancado:true, marcado:false,
          operacion:p.operacion||"",
          segmentos:[{areaId,inicio:horaInicio||"",fin:""}]});
      }
    });
    saveAsist(nuevas);
  };

  // Asistencia
  const updSeg=(id,idx,campo,val)=>saveAsist(asistencias.map(tw=>{
    if(tw.id!==id) return tw;
    const ss=[...(tw.segmentos||[])];
    if(campo==="borrar") ss.splice(idx,1);
    else if(campo==="agregar") ss.push(val);
    else ss[idx]={...ss[idx],[campo]:val};
    return {...tw,segmentos:ss};
  }));
  const ausente=id=>saveAsist(asistencias.map(tw=>tw.id!==id?tw:{...tw,ausente:true}));
  const setOp=(id,op)=>saveAsist(asistencias.map(tw=>tw.id!==id?tw:{...tw,operacion:op}));

  const abrirMovLinea=areaId=>{setMovLineaId(areaId);setMovSegs([{areaId,inicio:"",fin:""}]);};
  const aplicarMovimiento=()=>{
    const ids=asistencias.filter(tw=>tw.lineaBase===movLineaId&&!tw.ausente).map(tw=>tw.id);
    saveAsist(asistencias.map(tw=>ids.includes(tw.id)?{...tw,segmentos:[...movSegs]}:tw));
    setMovLineaId(null); setMovSegs([]);
  };
  const moverGrupo=lid=>{
    if(!selGrupo.length) return;
    saveAsist(asistencias.map(tw=>selGrupo.includes(tw.id)?{...tw,segmentos:[...(tw.segmentos||[]),{areaId:lid,inicio:"",fin:""}]}:tw));
    setSelGrupo([]);
  };

  // Historial
  const guardarHist=asis=>{
    if(!asis.length) return;
    const fecha=new Date().toLocaleDateString("es-MX",{weekday:"short",day:"2-digit",month:"short",year:"numeric"});
    const resAreas=areas.map(a=>{
      let costoTotal=0; const opsCount={}; const personas=[];
      asis.filter(tw=>!tw.ausente).forEach(tw=>{
        const {distLineas,horas:ht,extras,esFijo,costoTotal:costoTotalTw}=calcDist(tw,areas);
        if(distLineas[a.id]&&distLineas[a.id].mins>0){
          costoTotal+=distLineas[a.id].costo;
          personas.push({
            nombre:tw.nombre,operacion:tw.operacion||"-",
            esBase:tw.lineaBase===a.id,
            horas:distLineas[a.id].frac*(ht||0),
            costoEnArea:distLineas[a.id].costo,
            costoTotalDia:costoTotalTw,
            extras,esFijo
          });
        }
        if(tw.lineaBase===a.id&&tw.operacion) opsCount[tw.operacion]=(opsCount[tw.operacion]||0)+1;
      });
      return {id:a.id,nombre:a.nombre,color:a.color,costoTotal,opsCount,personas};
    });
    const fijosPresentes=Object.entries(SUELDOS_FIJOS)
      .filter(([nm])=>asis.some(tw=>tw.nombre===nm&&tw.marcado&&!tw.ausente))
      .map(([nm,s])=>({nombre:nm,costoDia:s/7}));
    const snap={
      fecha, fechaDia:fechaDia||fecha,
      resAreas,
      totalPlanta:resAreas.reduce((s,a)=>s+a.costoTotal,0),
      presentes:asis.filter(tw=>!tw.ausente).length,
      ausentes:asis.filter(tw=>tw.ausente).map(tw=>tw.nombre),
      fijosPresentes,
      totalFijos:fijosPresentes.reduce((s,f)=>s+f.costoDia,0)
    };
    saveHist([snap,...historial].slice(0,60));
  };
  const confirmarNuevoDia=()=>{
    guardarHist(asistencias);
    const resetadas = asistencias.map(tw=>({
      id: tw.id,
      nombre: tw.nombre,
      lineaBase: tw.lineaBase,
      operacion: tw.operacion,
      ausente: false,
      marcado: false,
      arrancado: false,
      estado: null,
      segmentos: []
    }));
    saveAsist(resetadas);
    saveFecha("");
    setArranqueHoras({});
    setConfirmNuevoDia(false);
    setTab("plantilla");
  };

  // Resumen
  const resumen=areas.map(a=>{
    let costoTotal=0; const opsCount={}; let personasEnArea=0;
    asistencias.filter(tw=>!tw.ausente).forEach(tw=>{
      const {distLineas}=calcDist(tw,areas);
      if(distLineas[a.id]&&distLineas[a.id].mins>0){costoTotal+=distLineas[a.id].costo;personasEnArea++;}
      if(tw.lineaBase===a.id&&tw.operacion) opsCount[tw.operacion]=(opsCount[tw.operacion]||0)+1;
    });
    return {...a,costoTotal,opsCount,personasEnArea};
  });
  const totalPlanta=resumen.reduce((s,a)=>s+a.costoTotal,0);
  const presentes=asistencias.filter(tw=>!tw.ausente).length;
  const ausentes=asistencias.filter(tw=>tw.ausente).map(tw=>tw.nombre);
  const activos=asistencias.filter(tw=>!tw.ausente);
  const fechaHoy=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});

  // -- Vista reporte ---------------------------------------------------------
  if(vistaRep){
    const th={padding:"4px 7px",textAlign:"left",borderBottom:"1px solid #ccc",fontSize:9,background:"#f5f5f5"};
    const thR={padding:"4px 7px",textAlign:"right",borderBottom:"1px solid #ccc",fontSize:9,background:"#f5f5f5"};
    const td={padding:"3px 7px",borderBottom:"1px solid #eee"};
    const tdR={padding:"3px 7px",borderBottom:"1px solid #eee",textAlign:"right"};

    return (
      <div style={{background:"#fff",color:"#111",fontFamily:"Arial,sans-serif",fontSize:11,padding:16,minHeight:"100vh"}}>
        <div style={{background:"#e8f5e9",border:"1px solid #4caf50",borderRadius:4,padding:"8px 10px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:10}}><b> Compartir:</b> Safari > compartir > Guardar PDF</span>
          <button onClick={()=>setVistaRep(null)} style={{background:"#111",color:"#fff",border:"none",borderRadius:3,padding:"4px 12px",fontSize:10,cursor:"pointer",fontFamily:"inherit",marginLeft:8}}>x Cerrar</button>
        </div>

        <div style={{borderBottom:"2px solid #111",paddingBottom:6,marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:16,letterSpacing:1}}>
            {vistaRep==="areas" && "CONFIGURACION DE AREAS"}
            {vistaRep==="plantilla" && ("PLANTILLA"+(openPlt?" - "+(areas.find(a=>a.id===openPlt)?.nombre||"").toUpperCase():""))}
            {vistaRep==="asistencia" && "ASISTENCIAS DEL DIA"}
            {vistaRep==="resumen" && "RESUMEN GENERAL DE COSTOS"}
            {vistaRep==="historial" && "HISTORIAL DE DIAS"}
            {vistaRep==="grupo" && "GRUPOS"}
          </div>

        </div>

        {vistaRep==="areas" && areas.map(a=>(
          <div key={a.id} style={{marginBottom:12,border:"1px solid #ddd",borderRadius:4,overflow:"hidden"}}>

            <div style={{padding:"7px 10px"}}>

                {pers.map((p,i)=>(<tr key={i}><td style={td}>{i+1}</td><td style={{...td,fontWeight:600}}>{p.nombre||p}</td><td style={{...td,color:"#555"}}>{p.operacion||"-"}</td></tr>))}
                {!pers.length&&<tr><td colSpan="3" style={{...td,textAlign:"center",color:"#999"}}>Sin personal</td></tr>}
              </tbody>
            </table>
            <div style={{fontSize:10,color:"#666",marginTop:3}}>Total: {pers.length} personas</div>
          </div>);

        {vistaRep==="asistencia" && (<>
          <div style={{background:"#111",color:"#fff",padding:"4px 8px",borderRadius:4,marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontWeight:700,fontSize:11,letterSpacing:1}}>NOMINA DEL DIA</div>
              <div style={{fontSize:8,color:"#aaa"}}>{fechaDia||fechaHoy}</div>

            <div style={{textAlign:"right"}}>
              <div style={{fontSize:14,fontWeight:700,color:"#a8e063"}}>{money(totalPlanta)}</div>

            </div>
          </div>

            const pData=asistencias.filter(tw=>!tw.ausente).map(tw=>{
              const {distLineas,horas:ht,extras,esFijo,costoTotal:costoTotalTw}=calcDist(tw,areas);
              const d=distLineas[a.id]; if(!d||d.mins<=0) return null;
              return {
                nombre:tw.nombre,
                esBase:tw.lineaBase===a.id,

                <span style={{fontWeight:700,fontSize:10,letterSpacing:1}}>{a.nombre.toUpperCase()} . {pData.length} pers</span>
                <span style={{fontWeight:700,fontSize:10}}>{money(a.costoTotal)}</span>
              </div>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:8,flex:1}}>
                <thead>
                  <tr style={{background:"#f5f5f5"}}>

                    <th style={{padding:"2px 4px",textAlign:"right",fontSize:7,borderBottom:"1px solid #ddd"}}>Total dia</th>
                  </tr>
                </thead>
                <tbody>
                  {pData.map((p,i)=>(
                    <tr key={i} style={{borderBottom:"1px solid #f0f0f0",background:i%2===0?"#fff":"#fafafa"}}>
                      <td style={{padding:"2px 4px",fontSize:8,color:p.esBase?"#111":"#4a7acc"}}>
                        {p.nombre.split(" ").slice(0,2).join(" ")}{!p.esBase?" (ext)":""}{p.esFijo?" ":""}
                      </td>
                      <td style={{padding:"2px 4px",textAlign:"right",fontSize:8}}>{fmt1(p.horas)}</td>
                      <td style={{padding:"2px 4px",textAlign:"right",fontSize:8,color:"#666"}}>{money(p.costoEnArea)}</td>
                      <td style={{padding:"2px 4px",textAlign:"right",fontWeight:700,fontSize:8,color:"#2d6a2d"}}>{money(p.costoTotalDia)}</td>
                    </tr>
                  ))}
                  <tr style={{background:"#f0f0f0",fontWeight:700,borderTop:"1px solid #ccc"}}>
                    <td style={{padding:"2px 4px",fontSize:8}}>TOTAL {a.nombre}</td>
                    <td style={{padding:"2px 4px",textAlign:"right",fontSize:8}}>{fmt1(totalH)}</td>
                    <td style={{padding:"2px 4px",textAlign:"right",fontSize:8,color:"#2d6a2d"}}>{money(a.costoTotal)}</td>
                    <td style={{padding:"2px 4px"}}></td>
                  </tr>
                </tbody>
              </table>
            </div>);
          })}

          {(()=>{
            const fijosPresentes=Object.entries(SUELDOS_FIJOS).filter(([nm])=>asistencias.some(tw=>tw.nombre===nm&&tw.marcado&&!tw.ausente));
            if(!fijosPresentes.length) return null;
            const totalFijos=fijosPresentes.reduce((s,[,v])=>s+v/7,0);
            return (<div style={{marginBottom:5,border:"1.5px solid #cc8a00",borderRadius:3,overflow:"hidden"}}>
              <div style={{background:"#cc8a00",color:"#fff",padding:"3px 6px",display:"flex",justifyContent:"space-between"}}>
                <span style={{fontWeight:700,fontSize:10}}>SUELDO FIJO . {fijosPresentes.length} pers</span>
                <span style={{fontWeight:700,fontSize:10}}>{money(totalFijos)}</span>
              </div>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:8}}>
                <tbody>
                  {fijosPresentes.map(([nm,s],i)=>(
                    <tr key={i} style={{borderBottom:"1px solid #f0f0f0",background:i%2===0?"#fff":"#fafafa"}}>
                      <td style={{padding:"2px 4px"}}>{nm.split(" ").slice(0,2).join(" ")}</td>
                      <td style={{padding:"2px 4px",textAlign:"right",fontWeight:700,color:"#2d6a2d"}}>{money(s/7)}</td>
                    </tr>
                  ))}
                  <tr style={{background:"#f0f0f0",fontWeight:700,borderTop:"1px solid #ccc"}}>
                    <td style={{padding:"2px 4px",fontSize:8}}>TOTAL FIJOS</td>
                    <td style={{padding:"2px 4px",textAlign:"right",fontSize:8,color:"#2d6a2d"}}>{money(totalFijos)}</td>
                  </tr>
                </tbody>
              </table>
            </div>);
          })()}

          {ausentes.length>0&&<div style={{fontSize:8,color:"#666",marginBottom:4}}><b>Ausentes:</b> {ausentes.join(", ")}</div>}
          <div style={{background:"#111",color:"#fff",padding:"4px 8px",borderRadius:3,display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:10}}>
            <span>TOTAL PLANTA . {presentes} personas</span>
            <span style={{color:"#a8e063"}}>{money(totalPlanta)}</span>
          </div>
          <div style={{marginTop:10,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,fontSize:8,color:"#999"}}>
            <div style={{borderTop:"1px solid #ccc",paddingTop:3}}>Elaboro: _______________</div>
            <div style={{borderTop:"1px solid #ccc",paddingTop:3}}>Autorizo: _______________</div>
          </div>
        </>)}

        {vistaRep==="resumen" && (<>
          {/* Header compacto */}
          <div style={{background:"#111",color:"#fff",padding:"6px 10px",borderRadius:4,marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:700,fontSize:13,letterSpacing:1}}>RESUMEN DEL DIA</div>
                <div style={{fontSize:9,color:"#aaa"}}>{fechaDia||fechaHoy}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:18,fontWeight:700,color:"#a8e063"}}>{money(totalPlanta)}</div>
                <div style={{fontSize:9,color:"#aaa"}}>{presentes} personas</div>
              </div>
            </div>
          </div>

          {/* Tabla compacta por area */}
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:9,marginBottom:6}}>
            <thead>
              <tr style={{background:"#333",color:"#fff"}}>
                <th style={{padding:"3px 5px",textAlign:"left",fontSize:8}}>Area</th>
                <th style={{padding:"3px 5px",textAlign:"right",fontSize:8}}>Pers</th>
                <th style={{padding:"3px 5px",textAlign:"right",fontSize:8}}>Horas ef.</th>
                <th style={{padding:"3px 5px",textAlign:"right",fontSize:8}}>Gasto</th>
              </tr>
            </thead>
            <tbody>
              {resumen.filter(a=>a.costoTotal>0).map(a=>{
                const pData=asistencias.filter(tw=>!tw.ausente).map(tw=>{
                  const {distLineas,horas:ht}=calcDist(tw,areas);
                  const d=distLineas[a.id]; if(!d||d.mins<=0) return null;
                  return {horas:d.frac*(ht||0),costo:d.costo};
                }).filter(Boolean);
                const totalH=pData.reduce((s,p)=>s+p.horas,0);
                return (<tr key={a.id} style={{borderBottom:"1px solid #eee"}}>
                  <td style={{padding:"3px 5px",fontWeight:700,color:a.color||"#111"}}>{a.nombre}</td>
                  <td style={{padding:"3px 5px",textAlign:"right"}}>{a.personasEnArea}</td>
                  <td style={{padding:"3px 5px",textAlign:"right"}}>{fmt1(totalH)}h</td>
                  <td style={{padding:"3px 5px",textAlign:"right",fontWeight:700}}>{money(a.costoTotal)}</td>
                </tr>);
              })}
              <tr style={{background:"#f0f0f0",fontWeight:700,fontSize:10}}>
                <td style={{padding:"4px 5px"}}>TOTAL</td>
                <td style={{padding:"4px 5px",textAlign:"right"}}>{presentes}</td>
                <td style={{padding:"4px 5px",textAlign:"right"}}>-</td>
                <td style={{padding:"4px 5px",textAlign:"right",color:"#2d6a2d"}}>{money(totalPlanta)}</td>
              </tr>
            </tbody>
          </table>

          {/* Detalle por persona ultra compacto */}
          {resumen.filter(a=>a.costoTotal>0).map(a=>{
            const pData=asistencias.filter(tw=>!tw.ausente).map(tw=>{
              const {distLineas,horas:ht,extras,esFijo}=calcDist(tw,areas);
              const d=distLineas[a.id]; if(!d||d.mins<=0) return null;
              return {nombre:tw.nombre,esBase:tw.lineaBase===a.id,horas:d.frac*(ht||0),costo:d.costo,extras,esFijo};
            }).filter(Boolean);
            if(!pData.length) return null;
            return (<div key={a.id} style={{marginBottom:6}}>
              <div style={{background:a.color||"#333",color:"#fff",padding:"2px 6px",fontSize:9,fontWeight:700,display:"flex",justifyContent:"space-between"}}>
                <span>{a.nombre}</span><span>{money(a.costoTotal)}</span>
              </div>
              {pData.map((p,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:8,padding:"2px 6px",borderBottom:"1px solid #f0f0f0",background:i%2===0?"#fafafa":"#fff"}}>
                  <span style={{flex:1,color:p.esBase?"#111":"#4a7acc"}}>{p.nombre.split(" ").slice(0,2).join(" ")}{!p.esBase?" (ext)":""}{p.esFijo?" ":""}</span>
                  <span style={{color:"#666",margin:"0 6px"}}>{fmt1(p.horas)}h{p.extras>0&&!p.esFijo?" +"+fmt1(p.extras)+"ext":""}</span>
                  <span style={{fontWeight:700,color:"#2d6a2d"}}>{money(p.costo)}</span>
                </div>
              ))}
            </div>);
          })}

          {/* Sueldo fijo */}
          {(()=>{
            const fijosPresentes=Object.entries(SUELDOS_FIJOS).filter(([nm])=>asistencias.some(tw=>tw.nombre===nm&&tw.marcado&&!tw.ausente));
            if(!fijosPresentes.length) return null;
            const totalFijos=fijosPresentes.reduce((s,[,v])=>s+v/7,0);
            return (<div style={{marginBottom:6}}>
              <div style={{background:"#cc8a00",color:"#fff",padding:"2px 6px",fontSize:9,fontWeight:700,display:"flex",justifyContent:"space-between"}}>
                <span>Sueldo Fijo</span><span>{money(totalFijos)}</span>
              </div>
              {fijosPresentes.map(([nm,s],i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:8,padding:"2px 6px",borderBottom:"1px solid #f0f0f0",background:i%2===0?"#fafafa":"#fff"}}>
                  <span style={{flex:1}}>{nm.split(" ").slice(0,2).join(" ")}</span>
                  <span style={{fontWeight:700,color:"#2d6a2d"}}>{money(s/7)}</span>
                </div>
              ))}
            </div>);
          })()}

          <div style={{background:"#111",color:"#fff",padding:"6px 10px",borderRadius:4,display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:12,marginTop:4}}>
            <span>TOTAL PLANTA - {presentes} personas</span>
            <span style={{color:"#a8e063"}}>{money(totalPlanta)}</span>
          </div>
        </>)}

        {vistaRep==="historial" && (<>
          {!historial.length&&<p style={{color:"#999",textAlign:"center",padding:20}}>Sin historial registrado</p>}
          {historial.map((h,i)=>(
            <div key={i} style={{marginBottom:14,border:"1px solid #ddd",borderRadius:4,overflow:"hidden"}}>
              <div style={{background:"#111",color:"#fff",padding:"5px 10px",display:"flex",justifyContent:"space-between"}}>
                <span style={{fontWeight:700,fontSize:13}}>{h.fechaDia||h.fecha}</span>
                <span style={{color:"#a8e063",fontWeight:700}}>{money(h.totalPlanta||0)}</span>
              </div>
              <div style={{padding:"6px 10px",fontSize:10}}>
                <div style={{fontSize:9,color:"#888",marginBottom:4}}>Presentes: {h.presentes}</div>
                {(h.resAreas||[]).filter(a=>a.costoTotal>0).map(a=>(
                  <div key={a.id} style={{marginBottom:8}}>
                    <div style={{background:a.color||"#333",color:"#fff",padding:"2px 6px",fontWeight:700,fontSize:10,display:"flex",justifyContent:"space-between"}}>
                      <span>{a.nombre}</span><span>{money(a.costoTotal)}</span>
                    </div>
                    {(a.personas||[]).map((p,j)=>(
                      <div key={j} style={{display:"flex",justifyContent:"space-between",fontSize:9,padding:"2px 6px",borderBottom:"1px solid #f0f0f0",background:j%2===0?"#fff":"#fafafa"}}>
                        <span style={{color:p.esBase?"#111":"#4a7acc",flex:1}}>{p.nombre}{!p.esBase?" (ext)":""}</span>
                        <span style={{color:"#666",margin:"0 6px"}}>{fmt1(p.horas)}h en area</span>
                        <span style={{fontWeight:700,color:"#2d6a2d"}}>{money(p.costoEnArea)}</span>
                      </div>
                    ))}
                  </div>
                ))}
                {h.fijosPresentes?.length>0&&(
                  <div style={{marginBottom:8}}>
                    <div style={{background:"#cc8a00",color:"#fff",padding:"2px 6px",fontWeight:700,fontSize:10,display:"flex",justifyContent:"space-between"}}>
                      <span>Sueldo Fijo</span><span>{money(h.totalFijos||0)}</span>
                    </div>
                    {h.fijosPresentes.map((f,j)=>(
                      <div key={j} style={{display:"flex",justifyContent:"space-between",fontSize:9,padding:"2px 6px",borderBottom:"1px solid #f0f0f0",background:j%2===0?"#fff":"#fafafa"}}>
                        <span style={{flex:1}}>{f.nombre}</span>
                        <span style={{fontWeight:700,color:"#2d6a2d"}}>{money(f.costoDia)}</span>
                      </div>
                    ))}
                  </div>
                )}
                {h.ausentes?.length>0&&<div style={{color:"#999",fontSize:9,marginTop:4}}>Ausentes: {h.ausentes.join(", ")}</div>}
              </div>
            </div>
          ))}
        </>)}

        {(vistaRep==="grupo")&&<p style={{color:"#999",textAlign:"center",padding:20}}>El reporte de grupos no aplica. Usa Asistencia o Resumen.</p>}
      </div>
    );
  }

  // -- UI Principal ----------------------------------------------------------
  return (<>
    <div className="wrap">
      <div className="hdr">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <h1>CONTROL DE ASISTENCIAS</h1>
            <div className="hdr-sub">Areas . Operaciones . Costos reales por hora</div>
          </div>
          <input value={fechaDia} onChange={e=>saveFecha(e.target.value)}
            style={{background:"rgba(255,255,255,0.08)",border:"1px solid #333",borderRadius:3,
              padding:"4px 8px",fontFamily:"'IBM Plex Mono',monospace",fontSize:10,fontWeight:700,
              color:"#a8e063",outline:"none",width:100,textAlign:"center",marginTop:4}}
            placeholder="dd/mm/aa"/>
        </div>
        <div className="tarifas">
          <div className="tarifa">Jornal <b>$360/8h</b></div>
          <div className="tarifa">Hr extra <b>$50</b></div>
        </div>
      </div>

      <div className="tabs">
        {[["areas"," Areas"],["plantilla"," Plantilla"],["asistencia"," Asistencia"],["grupo"," Grupo"],["resumen"," Resumen"],["captura"," Captura"],["vista"," Vista"],["historial"," Historial"]].map(([id,lbl])=>(
          <button key={id} className={"tab"+(tab===id?" on":"")} onClick={()=>setTab(id)}>{lbl}</button>
        ))}
      </div>

      <button className="btn-rep" onClick={()=>setVistaRep(tab)}> Ver reporte de esta vista</button>

      {/* AREAS */}
      {tab==="areas"&&(<>
        <div className="sec">Areas de produccion</div>
        <div className="nueva">
          <span className="fl">Nueva area</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:6,marginTop:5}}>
            <input className="fi" placeholder="Nombre del area..." value={nuevoArea} onChange={e=>setNuevoArea(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addArea()}/>
            <button className="btn-g" onClick={addArea}>+ Agregar</button>
          </div>
        </div>
        {areas.map(a=>(
          <div className="ac" key={a.id} style={{borderColor:openArea===a.id?a.color+"66":"#1a1a1a"}}>
            <div className="ahd" onClick={()=>setOpenArea(o=>o===a.id?null:a.id)}>
              <div className="dot" style={{background:a.color}}/>
              <div className="anm" style={{color:a.color}}>{a.nombre}</div>
              <span style={{color:"#333",fontSize:9,marginLeft:8}}>{openArea===a.id?"^":"v"}</span>
            </div>
            {openArea===a.id&&(<div className="abd">
              <div className="trow"><span className="tlbl">Descuento comida (1h)</span><label className="tgl"><input type="checkbox" checked={a.hayComida} onChange={e=>updArea(a.id,"hayComida",e.target.checked)}/><span className="tsl"/></label></div>
              <div className="trow"><span className="tlbl">Descuento cena (1h)</span><label className="tgl"><input type="checkbox" checked={a.hayCena} onChange={e=>updArea(a.id,"hayCena",e.target.checked)}/><span className="tsl"/></label></div>
              <div className="ops-lbl">Operaciones base</div>
              <div className="ops-list">{getOpsBase(a.opsBase||"general").map(op=><div className="op-base" key={op}>{op}</div>)}</div>
              {a.opsExtra?.length>0&&(<><div className="ops-lbl">Exclusivas</div><div className="ops-list">{a.opsExtra.map(op=><div className="op-extra" key={op}>{op}<button className="bx" onClick={()=>delOpExtra(a.id,op)}>x</button></div>)}</div></>)}
              <div className="add-row" style={{marginTop:6}}>
                <input placeholder="Nueva operacion exclusiva..." value={opExtraInp[a.id]||""} onChange={e=>setOpExtraInp(x=>({...x,[a.id]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addOpExtra(a.id,opExtraInp[a.id]||"")}/>
                <button className="btn-g" onClick={()=>addOpExtra(a.id,opExtraInp[a.id]||"")}>+ Op</button>
              </div>
              {confirmDelArea===a.id?(
                <div className="confirm" style={{background:"#1a0d0d",border:"1.5px solid #cc4a4a",marginTop:8}}>
                  <p style={{color:"#cc4a4a"}}>Eliminar "{a.nombre}"?</p>
                  <div className="cfbtns"><button className="csi" onClick={confirmarDelArea}>Si, eliminar</button><button className="cno" onClick={()=>setConfirmDelArea(null)}>Cancelar</button></div>
                </div>
              ):(
                <button className="btn-sm" onClick={()=>setConfirmDelArea(a.id)}>x Eliminar area</button>
              )}
            </div>)}
          </div>
        ))}
      </>)}

      {/* PLANTILLA */}
      {tab==="plantilla"&&(<>
        <div className="sec">Plantilla por area</div>
        {areas.map(a=>{
          const ops=getOps(a); const lista=plantilla[a.id]||[];
          return (<div className="lb" key={a.id} style={{borderColor:openPlt===a.id?a.color+"66":"#1a1a1a"}}>
            <div className="lbhd" onClick={()=>setOpenPlt(o=>o===a.id?null:a.id)}>
              <div className="dot" style={{background:a.color}}/><div className="lbnm" style={{color:a.color}}>{a.nombre}</div>
              <div className="lbct">{lista.length} personas</div>
              <span style={{color:"#333",fontSize:9,marginLeft:6}}>{openPlt===a.id?"^":"v"}</span>
            </div>
            {openPlt===a.id&&(<div className="lbbd">
              <div className="nlist">
                {lista.map(p=>{const nm=p.nombre||p,op=p.operacion||""; return (
                  <div className="nitem" key={nm}>
                    <span className="nitem-nm">{nm}</span>
                    <select value={op} onChange={e=>updOpPlt(a.id,nm,e.target.value)} style={{fontSize:8,padding:"2px 5px",border:"1px solid #222",borderRadius:10,background:"#0e0e0e",color:"#666",fontFamily:"'IBM Plex Mono',monospace",outline:"none",maxWidth:90}}>
                      <option value="">- op -</option>{ops.map(o=><option key={o} value={o}>{o}</option>)}
                    </select>
                    <button className="bx" style={{fontSize:13}} onClick={()=>delNombre(a.id,nm)}>x</button>
                  </div>
                );})}
                {!lista.length&&<div style={{color:"#222",fontSize:9,textAlign:"center"}}>Sin personal</div>}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,marginBottom:6}}>
                <input placeholder="Nombre..." value={inputs[a.id]||""} onChange={e=>setInputs(i=>({...i,[a.id]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addNombre(a.id)}
                  style={{border:"1.5px solid #1e1e1e",borderRadius:3,padding:"5px 7px",fontFamily:"'IBM Plex Mono',monospace",fontSize:12,fontWeight:600,background:"#080808",color:"#e0dcd4",outline:"none"}}/>
                <select value={opInputs[a.id]||""} onChange={e=>setOpInputs(i=>({...i,[a.id]:e.target.value}))} style={{border:"1.5px solid #1e1e1e",borderRadius:3,padding:"5px 7px",fontFamily:"'IBM Plex Mono',monospace",fontSize:11,background:"#080808",color:"#e0dcd4",outline:"none"}}>
                  <option value="">- operacion -</option>{ops.map(o=><option key={o} value={o}>{o}</option>)}
                </select>
              </div>
              <button className="btn-g" style={{width:"100%"}} onClick={()=>addNombre(a.id)}>+ Agregar persona</button>
            </div>)}
          </div>);
        })}
        <button className="btn-ini" onClick={()=>{ iniciarDia(); setArranqueHoras({}); }}>> INICIAR TODAS LAS LINEAS</button>

          <div className="sec">Arranque por linea</div>
          <div style={{background:"#0e0e0e",border:"1px solid #1a1a1a",borderRadius:4,padding:"10px"}}>
            <div style={{fontSize:8,color:"#555",marginBottom:8,letterSpacing:1}}>Arranca cada linea con su hora de inicio</div>
            {areas.map(a=>{
              const enPlt=(plantilla[a.id]||[]).filter(p=>!Object.keys(SUELDOS_FIJOS).includes(p.nombre||p));
              const arrancada = enPlt.length>0 && enPlt.some(p=>{
                const tw=asistencias.find(t=>t.nombre===(p.nombre||p));
                return tw?.arrancado===true;
              });
              const horaArr = arranqueHoras[a.id]||"";
              const col=a.color;
              return (
                <div key={a.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,padding:"6px 8px",
                  background:arrancada?"#0d1a0d":"#141414",borderRadius:3,
                  border:"1px solid "+(arrancada?col+"66":col+"22")}}>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:14,letterSpacing:2,color:col}}>{a.nombre}</div>
                    {arrancada&&<div style={{fontSize:7,color:"#a8e063",letterSpacing:1}}>v ARRANCADA{horaArr?" - "+horaArr:""}</div>}
                  </div>
                  <input type="time" value={horaArr}
                    onChange={e=>setArranqueHoras(h=>({...h,[a.id]:e.target.value}))}
                    style={{border:"1.5px solid "+col+"55",borderRadius:3,padding:"3px 6px",
                      fontFamily:"'IBM Plex Mono',monospace",fontSize:12,fontWeight:700,
                      background:"#080808",color:"#e0dcd4",outline:"none",width:90}}/>
                  {horaArr&&(
                    <button onClick={()=>setArranqueHoras(h=>({...h,[a.id]:""}))}
                      style={{background:"transparent",border:"none",color:"#555",cursor:"pointer",fontSize:14,padding:"0 2px"}}>x</button>
                  )}
                  <button onClick={()=>iniciarLinea(a.id, horaArr)}
                    style={{padding:"5px 10px",background:arrancada?"#1a3a1a":col,
                      border:"1.5px solid "+col,borderRadius:3,
                      fontFamily:"'IBM Plex Mono',monospace",fontSize:8,fontWeight:700,
                      color:arrancada?col:"#080808",cursor:"pointer",whiteSpace:"nowrap"}}>
                    {arrancada?" Re-arrancar":"Arrancar"}
                  </button>
                </div>
              );
            })}
          </div>
      </>)}

      {/* ASISTENCIA */}
      {tab==="asistencia"&&(<>
        {/* Sueldo fijo - 4 estados */}
        <div className="sec">Sueldo fijo</div>
        <div style={{background:"#0e0e0e",border:"1px solid #1a1a1a",borderRadius:4,marginBottom:10,overflow:"hidden"}}>
          {Object.entries(SUELDOS_FIJOS).map(([nombre,sueldo])=>{
            const aBase=areas.find(a=>(plantilla[a.id]||[]).some(p=>(p.nombre||p)===nombre));
            const costoDia=sueldo/7;
            const tw=asistencias.find(t=>t.nombre===nombre);
            const estado=tw?.estado||null;
            const estados=[
              ["presente",  "v Presente",   "#2d8a2d","#0d1a0d"],
              ["descanso_c"," D.c/goce",  "#4a7acc","#0d111a"],
              ["falta",     "x Falta",      "#cc4a4a","#1a0d0d"],
              ["descanso_s","[!] D.s/goce",  "#cc6600","#1a110d"],
            ];
            return (<div key={nombre} style={{padding:"7px 10px",borderBottom:"1px solid #141414"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:10,fontWeight:700,color:estado==="falta"||estado==="descanso_s"?"#444":"#e0dcd4"}}>{nombre.split(" ").slice(0,2).join(" ")}</div>
                  <div style={{fontSize:7,color:"#555",marginTop:1}}>{aBase?.nombre||"-"} . {money(costoDia)}/dia</div>
                </div>
              </div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {estados.map(([est,lbl,color,bg])=>(
                  <button key={est} onClick={()=>{
                    if(!tw){
                      const areaId=aBase?.id||"indirectos";
                      const p=(Object.values(plantilla).flat()).find(x=>(x.nombre||x)===nombre);
                      saveAsist([...asistencias,{id:Date.now()+Math.random(),nombre,lineaBase:areaId,
                        ausente:est==="falta"||est==="descanso_s",marcado:true,estado:est,
                        operacion:p?.operacion||"",segmentos:[]}]);
                    } else {
                      const nuevoEstado=estado===est?null:est;
                      saveAsist(asistencias.map(t=>t.nombre===nombre?{...t,
                        estado:nuevoEstado,marcado:nuevoEstado!==null,
                        ausente:nuevoEstado==="falta"||nuevoEstado==="descanso_s"}:t));
                    }
                  }} style={{flex:1,padding:"5px 4px",border:"1.5px solid "+(estado===est?color:"#2a2a2a"),borderRadius:3,
                    background:estado===est?bg:"transparent",fontFamily:"'IBM Plex Mono',monospace",
                    fontSize:7,fontWeight:700,cursor:"pointer",color:estado===est?color:"#444",whiteSpace:"nowrap"}}>
                    {lbl}
                  </button>
                ))}
              </div>
            </div>);
          })}
        </div>

        {/* Buscador */}
        <div style={{marginBottom:10}}>
          <input
            placeholder=" Buscar persona por nombre..."
            value={busqueda}
            onChange={e=>setBusqueda(e.target.value)}
            style={{width:"100%",border:"1.5px solid #2d8a2d",borderRadius:3,padding:"7px 10px",
              fontFamily:"'IBM Plex Mono',monospace",fontSize:12,fontWeight:600,
              background:"#0e0e0e",color:"#e0dcd4",outline:"none"}}/>
          {busqueda.length>=2&&(()=>{
            const term=busqueda.toLowerCase();
            const resultados=asistencias.filter(tw=>tw.nombre.toLowerCase().includes(term));
            if(!resultados.length) return <div style={{fontSize:9,color:"#555",padding:"6px 8px",background:"#111",borderRadius:3,marginTop:4}}>No se encontro ninguna persona</div>;
            return (<div style={{background:"#111",borderRadius:3,marginTop:4,overflow:"hidden"}}>
              {resultados.map(tw=>{
                const {costoTotal,horas,extras,esFijo}=calcDist(tw,areas);
                const aBase=areas.find(a=>a.id===tw.lineaBase);
                const segs=(tw.segmentos||[]).filter(s=>s.inicio);
                return (<div key={tw.id} style={{padding:"8px 10px",borderBottom:"1px solid #1a1a1a"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <span style={{fontSize:11,fontWeight:700,color:"#e0dcd4"}}>{tw.nombre}</span>
                    {costoTotal>0&&<span style={{fontSize:10,fontWeight:700,color:"#a8e063"}}>{money(costoTotal)}</span>}
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",fontSize:8}}>
                    <span style={{background:aBase?.bg,color:aBase?.color,padding:"2px 7px",borderRadius:10,fontWeight:700}}>{aBase?.nombre||"-"}</span>
                    {tw.operacion&&<span style={{color:"#888"}}>{tw.operacion}</span>}
                    {tw.ausente&&<span style={{color:"#f08060",fontWeight:700}}>AUSENTE</span>}
                    {esFijo&&<span style={{color:"#f0c050",fontWeight:700}}>FIJO {money(getCostoDiarioFijo(tw.nombre))}/dia</span>}
                  </div>

                </div>
              ))}
              {h.fijosPresentes?.length>0&&(
                <div>
                  <div className="hr"><label style={{color:"#cc8a00",fontWeight:700}}>Sueldo Fijo</label><span>{money(h.totalFijos||0)}</span></div>
                  {h.fijosPresentes.map((f,j)=>(
                    <div key={j} style={{display:"flex",justifyContent:"space-between",fontSize:7,padding:"1px 8px",color:"#444",borderBottom:"1px solid #0e0e0e"}}>
                      <span>{f.nombre.split(" ").slice(0,2).join(" ")}</span>
                      <span style={{color:"#a8e063"}}>{money(f.costoDia)}</span>
                    </div>
                  ))}
                </div>
              )}
              {h.ausentes?.length>0&&<div style={{fontSize:7,color:"#333",marginTop:4}}>Ausentes: {h.ausentes.join(", ")}</div>}
            </div>
          </div>
        ))}
        {!!historial.length&&(confirmDelHist?(
          <div className="confirm" style={{background:"#1a0d0d",border:"1.5px solid #cc4a4a",marginTop:8}}>
            <p style={{color:"#cc4a4a"}}>Borrar todo el historial?</p>
            <div className="cfbtns"><button className="csi" onClick={()=>{saveHist([]);setConfirmDelHist(false);}}>Si, borrar</button><button className="cno" onClick={()=>setConfirmDelHist(false)}>Cancelar</button></div>
          </div>
        ):(
          <button className="bdanger" onClick={()=>setConfirmDelHist(true)}> Borrar historial</button>
        ))}
      </>)}

    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
